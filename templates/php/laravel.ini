; priority=99
; Managed by TerangaHost - optimisations PHP pour Laravel (CLI et FPM)
expose_php = Off
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 60
date.timezone = UTC

; OPcache : les fichiers sont revalides a chaque requete, ce qui reste sur apres une
; bascule de release ($realpath_root) meme si le rechargement de PHP-FPM echoue.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1

opcache.jit = tracing
opcache.jit_buffer_size = 32M
