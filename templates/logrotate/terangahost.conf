# Managed by TerangaHost
# Logs Laravel et PHP-FPM des sites (ecrits par deployer). Les logs Nginx sont geres par
# /etc/logrotate.d/nginx et ceux des workers par Supervisor (/var/log/supervisor/).
/var/www/*/shared/storage/logs/*.log {
    su deployer www-data
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}

/var/log/php*-fpm-*-slow.log {
    weekly
    rotate 4
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
