name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tests
        run: go test -race -count=1 ./...

      - name: Binaires
        run: make build-all VERSION=${GITHUB_REF_NAME} && (cd bin && sha256sum * > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          generate_release_notes: true
