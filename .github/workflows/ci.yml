name: TerangaHost CI

on:
  push:
    branches: [ main, master, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Test (Self-Hosted)
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -v -ldflags="-s -w" -o bin/terangahost main.go
